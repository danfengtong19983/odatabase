name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Clients written by other projects. See conformance/README.md.
  clients:
    runs-on: ubuntu-latest
    # UI5 always loads the current OpenUI5 release, so a new release must not block a change.
    continue-on-error: ${{ matrix.client == 'ui5' }}
    strategy:
      fail-fast: false
      matrix:
        client: [dotnet, java, python, openapi, ui5]
    env:
      BIND: 0.0.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: conformance/run-${{ matrix.client }}.sh
