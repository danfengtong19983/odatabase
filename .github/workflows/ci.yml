name: CI
# Actions are pinned to commit SHAs, with the version in a comment, so that a moved tag can't
# change what runs. Update them deliberately, for example with Dependabot.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The rust-version in Cargo.toml, which the dependencies decide.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11
        with:
          toolchain: "1.94"
      - run: cargo check --workspace --all-targets

  # The crate builds with any combination of its features, not only the defaults.
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "sqlite", "postgres", "sqlite,axum", "postgres,axum"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy -p odatabase --lib --no-default-features --features "${{ matrix.features }}" -- -D warnings

  # Coverage-guided fuzzing of the URL and $batch parsers, a minute each. See fuzz/.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run uri -- -max_total_time=60
      - run: cargo +nightly fuzz run batch -- -max_total_time=60

  # Known vulnerabilities, licenses and sources of dependencies. See deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11
        with:
          toolchain: stable
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --workspace --no-verify

  # Clients written by other projects. See conformance/README.md.
  clients:
    runs-on: ubuntu-latest
    # UI5 always loads the current OpenUI5 release, so a new release must not block a change.
    continue-on-error: ${{ matrix.client == 'ui5' }}
    strategy:
      fail-fast: false
      matrix:
        client: [dotnet, java, python, openapi, ui5]
    env:
      BIND: 0.0.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11
        with:
          toolchain: stable
      - run: conformance/run-${{ matrix.client }}.sh
